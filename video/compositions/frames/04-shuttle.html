    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;
      font-family: "Fira Sans", sans-serif;
      color: #e6dcc0;
    }

    .clip { position: absolute; inset: 0; }

    #v-study {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: -1;
    }

    #s-ground {
      z-index: -2;
      background-color: #141419;
    }

    /* ---- header tag ---- */
    #s-tag {
      position: absolute;
      left: 4cqw;
      top: 5cqw;
      display: flex;
      align-items: center;
      gap: 1.2cqw;
      font-family: "Geist Mono", monospace;
      font-size: 1.2cqw;
      letter-spacing: 0.08em;
      color: #9b9179;
    }
    #s-tag .shut {
      width: 2.6cqw;
      height: 1.05cqw;
      min-width: 26px;
      min-height: 11px;
      border-radius: 40% 50% 50% 40% / 60% 60% 60% 60%;
      background: #cfa457;
      border: 1px solid #4a3a1a;
      position: relative;
    }
    #s-tag .shut::after {
      content: "";
      position: absolute;
      left: 38%;
      top: 22%;
      width: 24%;
      height: 56%;
      border-radius: 50%;
      background: #dfa84d;
      box-shadow: 0 0 8px rgba(223, 168, 77, 0.8);
    }
    #s-tag b { font-weight: 500; color: #e6dcc0; }

    /* ---- caption, lower third ---- */
    #s-capbox {
      position: absolute;
      left: 4cqw;
      right: 4cqw;
      top: 70cqw;
    }
    .s-line {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      font-family: "Fira Sans Condensed", sans-serif;
      font-weight: 600;
      font-size: 4.7cqw;
      line-height: 1.05;
      color: #e6dcc0;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }
    .s-w { display: inline-block; will-change: transform, opacity; }
    .s-line .sep { color: #dfa84d; }

    /* ---- loomline echo: reed track + amber fill under the caption ---- */
    #s-reed {
      position: absolute;
      left: 4cqw;
      right: 4cqw;
      top: 77.4cqw;
      height: 0.7cqw;
      min-height: 7px;
    }
    #s-reedtrack {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(230, 220, 192, 0.35) 0px,
        rgba(230, 220, 192, 0.35) 2px,
        transparent 2px,
        transparent 9px
      );
      opacity: 0.5;
    }
    #s-reedfill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      background-image: repeating-linear-gradient(
        90deg,
        #dfa84d 0px,
        #dfa84d 2px,
        transparent 2px,
        transparent 9px
      );
      clip-path: inset(0% 100% 0% 0%);
      transform-origin: 0% 50%;
    }
  </style>

    tl.fromTo("#s-tag", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.3);
