  #root {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    container-type: size;
    background: transparent;
  }
  /* full-bleed ground — paper + permanent graph grid, lowest track */
  .ride-ground {
    position: absolute;
    inset: 0;
    background-color: #edf0f5;
    background-image:
      linear-gradient(to right, rgba(15, 78, 158, 0.1) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(15, 78, 158, 0.1) 1px, transparent 1px);
    background-size: 2cqw 2cqw;
    z-index: -2;
  }
  .ride-scene {
    position: absolute;
    inset: 0;
    overflow: hidden;
    /* the footage plates are hoisted to host root (z-auto, later DOM) —
       this lifts the authored scene above them as one stacking unit */
    z-index: 1;
  }
  /* the ONE camera wrapper — every world element lives inside it */
  .ride-world {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .ride-plate {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    /* hoisted to host root by assemble-index — sits under the scene's
       z-auto overlays there, same as under .ride-world here */
    z-index: -1;
    transform-origin: 50% 50%;
    will-change: transform, filter;
  }

  /* ---------- world chrome: LED tag pointing at the board ---------- */
  .ride-ledtag {
    position: absolute;
    left: 430px;
    top: 148px;
    z-index: 3;
  }
  .ride-ledchip {
    display: inline-block;
    background: #edf0f5;
    border: 1.5px solid #0f4e9e;
    padding: 8px 13px 9px;
    font-family: "Fira Code", monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #0f4e9e;
    white-space: nowrap;
  }
  .ride-ledstates {
    display: inline-grid;
    vertical-align: baseline;
  }
  .ride-ledstates span {
    grid-area: 1 / 1;
  }
  .ride-leader {
    position: absolute;
    left: 190px;
    top: 4px;
    width: 180px;
    height: 2px;
    transform: rotate(-18.5deg);
    transform-origin: 0 50%;
  }
  .ride-leader-fill {
    width: 100%;
    height: 100%;
    background: #0f4e9e;
    transform-origin: 0 50%;
  }
  .ride-leader-dot {
    position: absolute;
    right: -2px;
    top: -3px;
    width: 8px;
    height: 8px;
    background: #0f4e9e;
  }

  /* ---------- fixed frame furniture (HUD) ---------- */
  .ride-hud {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  .ride-rule-top,
  .ride-rule-bottom {
    position: absolute;
    left: 4cqw;
    right: 4cqw;
    height: 0;
    border-top: 1.5px solid #0f4e9e;
  }
  .ride-rule-top {
    top: 3cqw;
  }
  .ride-rule-bottom {
    bottom: 3cqw;
  }
  .ride-scenechip {
    position: absolute;
    left: 4cqw;
    top: 5.8cqw;
    background: #edf0f5;
    border: 1.5px solid #0f4e9e;
    padding: 7px 12px 8px;
    font-family: "Fira Code", monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #0f4e9e;
    white-space: nowrap;
  }
  .ride-pagenum {
    position: absolute;
    right: 4cqw;
    bottom: 3.9cqw;
    font-family: "Fira Code", monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #0f4e9e;
  }

  /* ---------- the display line card — lower third ---------- */
  .ride-card {
    position: absolute;
    left: 4cqw;
    bottom: 19cqw;
    display: inline-block;
    background-color: #edf0f5;
    background-image:
      linear-gradient(to right, rgba(15, 78, 158, 0.1) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(15, 78, 158, 0.1) 1px, transparent 1px);
    background-size: 2cqw 2cqw;
    border-top: 1.5px solid #0f4e9e;
    border-bottom: 1.5px solid #0f4e9e;
    padding: 2.1cqw 2.9cqw 2.3cqw;
    max-width: 84cqw;
  }
  .ride-kicker {
    font-family: "Fira Sans", sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #0f4e9e;
    margin-bottom: 0.9cqw;
    display: grid;
  }
  .ride-kicker span {
    grid-area: 1 / 1;
    white-space: nowrap;
  }
  .ride-lines {
    display: grid;
  }
  .ride-ln {
    grid-area: 1 / 1;
    font-family: "Fira Sans", sans-serif;
    font-weight: 400;
    font-size: 6.4cqw;
    line-height: 1.0;
    letter-spacing: -0.005em;
    color: #0f4e9e;
    white-space: nowrap;
  }
  .ride-w {
    display: inline-block;
    will-change: transform;
  }
  .ride-prog {
    margin-top: 1.7cqw;
    height: 1.5px;
    background: #0f4e9e;
    transform-origin: 0 50%;
  }

          <div data-hf-id="hf-16ci" class="ride-ln ride-ln2"><span data-hf-id="hf-i5qa" class="ride-w">all</span> <span data-hf-id="hf-0edi" class="ride-w">the</span> <span data-hf-id="hf-kkoe" class="ride-w">way</span> <span data-hf-id="hf-afma" class="ride-w">to</span> <span data-hf-id="hf-xo0u" class="ride-w">terminus</span></div>
        </div>
        <div data-hf-id="hf-r94o" class="ride-prog" id="ride-prog"></div>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    var world = document.getElementById("ride-world");
    /* the footage plates are hoisted to the host root at assemble time, so the
       same camera transform is written onto them by id (null-safe standalone) */
    var plates = [document.getElementById("b04-e1"), document.getElementById("b04-e2")].filter(Boolean);

    /* ---------- single camera state + single writer ---------- */
    var cam = { scale: 0.96, x: 0, y: 10 };
    var drift = { p: 0 };
    var blur = { v: 0 };

    function applyCamera() {
      var dx = Math.sin(drift.p) * 5;
      var dy = Math.sin(drift.p * 1.3) * 2.5;
      var t =
        "translate(" + (cam.x + dx).toFixed(2) + "px," + (cam.y + dy).toFixed(2) + "px) scale(" + cam.scale.toFixed(4) + ")";
      var f = blur.v > 0.05 ? "blur(" + blur.v.toFixed(2) + "px)" : "none";
      world.style.transform = t;
      world.style.filter = f;
      for (var i = 0; i < plates.length; i++) {
        plates[i].style.transform = t;
        plates[i].style.filter = f;
      }
    }
    applyCamera();

    /* drift driver — spans the whole comp, one sine channel */
    tl.to(drift, { p: Math.PI * 2 * 1.6, duration: 9, ease: "none", onUpdate: applyCamera }, 0);

    /* LEG 1 — dive in as the play-press lands + the fold begins */
    tl.to(cam, { scale: 1.04, y: 0, duration: 1.35, ease: "power3.out", onUpdate: applyCamera }, 0);
    /* LEG 2 — the cruise: slow steady push, holds alive via drift */
    tl.to(cam, { scale: 1.08, x: -6, duration: 5.05, ease: "power1.inOut", onUpdate: applyCamera }, 1.35);
    /* the exchange snap — the scrub jump resets framing on the hard cut */
    tl.to(cam, { scale: 1.0, x: 0, y: 0, duration: 0.06, ease: "power1.out", onUpdate: applyCamera }, 6.4);
    /* LEG 3 — the express push: accelerating, still traveling at the last frame */
    tl.to(cam, { scale: 1.15, x: -16, y: 6, duration: 2.54, ease: "power2.in", onUpdate: applyCamera }, 6.46);

    /* motion-blur envelopes on the travel legs — peaks at peak velocity, resolves on holds */
    tl.to(blur, { v: 2.4, duration: 0.32, ease: "power2.out", onUpdate: applyCamera }, 0);
    tl.to(blur, { v: 0, duration: 0.85, ease: "power2.out", onUpdate: applyCamera }, 0.5);
    tl.to(blur, { v: 3.0, duration: 0.18, ease: "power2.in", onUpdate: applyCamera }, 6.4);
    tl.to(blur, { v: 1.0, duration: 0.7, ease: "power2.out", onUpdate: applyCamera }, 6.58);
    tl.to(blur, { v: 2.2, duration: 1.6, ease: "power1.in", onUpdate: applyCamera }, 7.3);

    /* ---------- the display line card ---------- */
    tl.fromTo("#ride-card", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.4);

    /* line 1 sets word by word while day folds to night */
    tl.fromTo(
      ".ride-ln1 .ride-w",
      { y: 16, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.09 },
      0.85
    );

    /* kicker service state — LOCAL flips to EXPRESS on the express leg */
    tl.set("#ride-kick-b", { opacity: 0 }, 0);
    tl.set("#ride-kick-a", { opacity: 0 }, 7.0);
    tl.set("#ride-kick-b", { opacity: 1 }, 7.0);

    /* LED micro-label beat — chip pops, leader draws toward the board */
    tl.set("#ride-led-b", { opacity: 0 }, 0);
    tl.fromTo("#ride-ledchip", { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 3.55);
    tl.fromTo("#ride-leaderfill", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 3.75);
    tl.fromTo("#ride-leaderdot", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 4.05);
    tl.set("#ride-led-a", { opacity: 0 }, 7.05);
    tl.set("#ride-led-b", { opacity: 1 }, 7.05);

    /* route progress — the line being ridden, filling across both scenes */
    tl.fromTo("#ride-prog", { scaleX: 0 }, { scaleX: 1, duration: 5.5, ease: "none" }, 3.4);

    /* ---------- the in-place line swap on the express exchange ---------- */
    tl.to(
      ".ride-ln1 .ride-w",
      { y: -12, opacity: 0, duration: 0.26, ease: "power2.in", stagger: 0.045 },
      6.72
    );
    tl.fromTo(
      ".ride-ln2 .ride-w",
      { y: 14, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.09 },
      6.82
    );

    /* full-span anchor */
    tl.to({}, { duration: 9 }, 0);

    window.__timelines["04-ride"] = tl;
  })();
</script>
