    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      container-type: size;
      font-family: "Fira Sans", sans-serif;
      color: #1c2733;
    }

    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* ---------- ground: plano paper + permanent graph grid ---------- */
    #root .g-paper {
      z-index: -2;
      background-color: #edf0f5;
      background-image:
        linear-gradient(rgba(15, 78, 158, 0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 78, 158, 0.10) 1px, transparent 1px);
      background-size: 2cqw 2cqw;
    }

    /* ---------- scene 1: terminus footage ---------- */
    /* hoisted to host root by assemble-index — the id selector keeps it at
       z-index:-1 there, under the caption chip and the ground's z-index:-2 */
    #root video,
    [id="vid-terminus"] {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #root .cap-chip {
      position: absolute;
      left: 4cqw;
      top: 71cqh;
      display: flex;
      align-items: center;
      gap: 1.2cqw;
      background: #edf0f5;
      border: 0.14cqw solid #1c2733;
      padding: 1.1cqw 1.7cqw;
      will-change: clip-path;
    }
    #root .cap-chip .tick {
      width: 0.95cqw;
      height: 0.95cqw;
      background: #1c2733;
      flex: none;
    }
    #root .cap-chip .cap-line {
      font-size: 2.6cqw;
      line-height: 1.1;
      font-style: italic;
      color: #1c2733;
      white-space: nowrap;
    }
    #root .cap-chip .capw {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* ---------- scene 2: end plate ---------- */
    #root .plate-inner {
      position: absolute;
      inset: 0;
    }

    #root .rule-top,
    #root .rule-bottom {
      position: absolute;
      left: 4cqw;
      right: 4cqw;
      height: 0.14cqw;
      background: #1c2733;
    }
    #root .rule-top { top: 3cqw; }
    #root .rule-bottom { bottom: 3cqw; }

    #root .plate-micro {
      position: absolute;
      left: 4cqw;
      top: 5.2cqw;
      font-size: 1.5cqw;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #1c2733;
    }

    /* qr-block — corner punctuation, top-right */
    #root .qr {
      position: absolute;
      right: 4cqw;
      top: 5.0cqw;
      width: 5.6cqw;
      height: 5.6cqw;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      background: #edf0f5;
      box-shadow: 0 0 0 0.14cqw #edf0f5;
    }
    #root .qr i.on { background: #1c2733; }
    #root .qr i.off { background: rgba(15, 78, 158, 0.10); }

    #root .wm {
      position: absolute;
      left: 4cqw;
      top: 54cqh;
      font-size: 10.4cqw;
      line-height: 0.9;
      font-weight: 400;
      letter-spacing: -0.008em;
      color: #1c2733;
      white-space: nowrap;
    }
    #root .wm .wml {
      display: inline-block;
      will-change: transform, opacity;
    }

    #root .pitch {
      position: absolute;
      left: 4cqw;
      top: 71.5cqh;
      font-size: 2.35cqw;
      line-height: 1.2;
      font-weight: 400;
      color: #0f4e9e;
      white-space: nowrap;
      will-change: clip-path;
    }

    /* bottom hairline band — mono meta row above its rule */
    #root .band {
      position: absolute;
      left: 4cqw;
      right: 4cqw;
      top: 78.2cqh;
    }
    #root .band-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: "Fira Code", monospace;
      font-size: 1.35cqw;
      letter-spacing: 0.06em;
      color: #1c2733;
      padding-bottom: 0.9cqw;
    }
    #root .band-row .band-url,
    #root .band-row .band-meta {
      white-space: nowrap;
      will-change: clip-path;
    }
    #root .band-rule {
      height: 0.14cqw;
      background: #1c2733;
      will-change: transform;
    }

  <script>
    const tl = gsap.timeline({ paused: true });

    /* ---------- scene 1 (0.0–2.8): held terminus beat ---------- */
    // footage: slow settle as the train parks — held, not showy
    tl.fromTo(
      "#vid-terminus",
      { scale: 1.05 },
      { scale: 1, duration: 2.8, ease: "none" },
      0
    );

    // caption chip wipes on like a plate sliding into frame, then the line
    // sets word by word — the way the LED board does
    tl.fromTo(
      "#cap-chip",
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.out" },
      0.35
    );
    tl.fromTo(
      "#cap-chip .capw",
      { y: "0.45em", opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.11 },
      0.55
    );

    /* ---------- scene 2 (2.8–6.0): hard settle to the end plate ---------- */
    // the plate lands — a short, tactile settle, then it holds still
    tl.fromTo(
      "#plate-inner",
      { scale: 1.02 },
      { scale: 1, duration: 0.35, ease: "power2.out" },
      2.8
    );

    // chrome micro-label sets
    tl.fromTo(
      "#plate-micro",
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      3.05
    );

    // wordmark assembles letter by letter — low-left, the lockup's anchor
    tl.fromTo(
      "#wm .wml",
      { y: "0.35em", opacity: 0 },
      {
        y: 0,
        opacity: 1,
        duration: 0.5,
        ease: "back.out(1.7)",
        stagger: 0.085,
      },
      2.95
    );

    // pitch line wipes in left→right, board-style
    tl.fromTo(
      "#pitch",
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.inOut" },
      3.55
    );

    // bottom hairline band: rule draws on, then mono meta pieces set
    tl.fromTo(
      "#band-rule",
      { scaleX: 0, transformOrigin: "left center" },
      { scaleX: 1, transformOrigin: "left center", duration: 0.5, ease: "power2.inOut" },
      4.2
    );
    tl.fromTo(
      "#band-url",
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.out" },
      4.5
    );
    tl.fromTo(
      "#band-meta",
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.out" },
      4.8
    );

    // plate holds dead still 5.3 → 6.0

    window.__timelines = window.__timelines || {};
