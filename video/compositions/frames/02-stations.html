  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    window.__timelines["02-stations"] = tl;

    var F = 1 / 60;
    function el(id) {
      return document.getElementById(id);
    }

    /* ── mono label: discrete typewriter states (discrete-text-sequence).
       Scene 1 types "reading zoom"; at the 3.4s exchange it clears and
       re-types "pick → inspect" for the inspector landing. */
    var labelEl = el("02-stations-label-text");
    var SEQ = [{ t: 0, text: "" }];
    var L1 = "reading zoom";
    for (var i = 1; i <= L1.length; i++)
      SEQ.push({ t: 0.15 + (i - 1) * 0.055, text: L1.slice(0, i) });
    SEQ.push({ t: 3.4, text: "" });
    var L2 = "pick → inspect";
    for (var j = 1; j <= L2.length; j++)
      SEQ.push({ t: 3.46 + (j - 1) * 0.05, text: L2.slice(0, j) });
    var drv = { t: 0 };
    tl.to(
      drv,
      {
        t: 6,
        duration: 6,
        ease: "none",
        onUpdate: function () {
          var s = "";
          for (var k = SEQ.length - 1; k >= 0; k--) {
            if (drv.t >= SEQ[k].t) {
              s = SEQ[k].text;
              break;
            }
          }
          labelEl.textContent = s;
        },
      },
      0,
    );

    /* caret blink — deterministic sin square wave on the timeline */
    var caret = el("02-stations-label-caret");
    var blink = { p: 0 };
    tl.to(
      blink,
      {
        p: Math.PI * 2 * 8,
        duration: 6,
        ease: "none",
        onUpdate: function () {
          caret.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
        },
      },
      0,
    );

    /* ── route scan: marker steps station to station through Scene 1,
          then locks onto the picked stop at the exchange. */
    var marker = el("02-stations-route-scan");
    tl.set(marker, { opacity: 0 }, 0);
    var scanX = [5, 43, 81, 119, 157, 195];
    var scanT = [0.9, 1.35, 1.8, 2.25, 2.7, 3.15];
    scanT.forEach(function (t, i) {
      tl.set(marker, { opacity: 1, x: scanX[i] }, t);
    });
    tl.set(marker, { opacity: 0 }, 3.4);
    var picked = el("02-stations-tick-5");
    tl.set(picked, { attr: { "data-on": "1" } }, 3.45);
    tl.fromTo(
      picked,
      { scale: 1 },
      { scale: 1.55, duration: 0.18, ease: "power4.out" },
      3.45,
    );
    tl.to(picked, { scale: 1.3, duration: 0.24, ease: "power2.out" }, 3.63);

    /* ── nameplate slab deploys left→right, then the line waterfalls in */
    tl.fromTo(
      el("02-stations-slab-bg"),
      { scaleX: 0 },
      { scaleX: 1, duration: 0.4, ease: "power3.out", transformOrigin: "0% 50%" },
      0.35,
    );

    var bullet = el("02-stations-bullet");
    tl.set(bullet, { opacity: 0 }, 0);
    tl.set(bullet, { opacity: 1, y: 60 }, 0.55);
    tl.to(bullet, { y: 0, duration: 0.18, ease: "power4.out" }, 0.55);

    /* line A — "every step a station —" waterfall arrival (binary reveal) */
    var WA = [
      { el: el("02-stations-w1"), t: 0.62, y: 72, d: 0.18 },
      { el: el("02-stations-w2"), t: 0.62 + 0.18 + 2 * F, y: 48, d: 0.15 },
      { el: el("02-stations-w3"), t: 0.62 + 0.18 + 2 * F + 0.15 - F, y: 40, d: 0.13 },
      { el: el("02-stations-w4"), t: 0.62 + 0.18 + 2 * F + 0.15 - F + 0.13 - F, y: 55, d: 0.16 },
      { el: el("02-stations-w5"), t: 0.62 + 0.18 + 2 * F + 0.15 - F + 0.13 - F + 0.16 - 2 * F, y: 42, d: 0.12 },
    ];
    WA.forEach(function (w) {
      tl.set(w.el, { opacity: 0 }, 0);
      tl.set(w.el, { opacity: 1, y: w.y }, w.t);
      tl.to(w.el, { y: 0, duration: w.d, ease: "power4.out" }, w.t);
    });

    /* ── seam at 3.4s: waterfall cut — line A's words rip out left,
          line B's words ignite mid-flight from the right, and the
          plate hard-exchanges on the same frame. */
    var T0 = 3.4 - (4 * 0.022 + 0.18); /* last word's fade lands on the cut */
    WA.forEach(function (w, i) {
      var t = T0 + i * 0.022;
      tl.to(w.el, { x: -230, duration: 0.34, ease: "power4.in" }, t);
      tl.to(w.el, { opacity: 0, duration: 0.18, ease: "power1.in" }, t);
    });

    var VB = [
      el("02-stations-v1"),
      el("02-stations-v2"),
      el("02-stations-v3"),
      el("02-stations-v4"),
      el("02-stations-v5"),
    ];
    VB.forEach(function (v) {
      tl.set(v, { x: 230, opacity: 0 }, 0);
    });
    var gap = 0.05;
    var tIn = 3.4;
    VB.forEach(function (v) {
      tl.fromTo(
        v,
        { x: 230, opacity: 0.35 },
        {
          x: 0,
          opacity: 1,
          duration: 0.3,
          ease: "power4.out",
          immediateRender: false,
        },
        tIn,
      );
      tIn += gap;
      gap *= 0.84;
    });

    tl.seek(0);
  </script>
